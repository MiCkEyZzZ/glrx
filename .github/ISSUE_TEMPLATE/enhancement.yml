name: Enhancement
description: Suggest an improvement to an existing GLRX component
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose an improvement to something that already exists in GLRX.
        For completely new functionality, use the Feature Request template instead.

  - type: dropdown
    id: area
    attributes:
      label: Area of enhancement
      multiple: true
      options:
        - RF frontend / IQ source
        - DSP primitives / signal processing
        - PRN code generation
        - Acquisition
        - Tracking loops (DLL / PLL / FLL)
        - Navigation decoding
        - Observables / pseudorange
        - Position solver
        - Output formats (NMEA / UBX / telemetry)
        - Pipeline / integration
        - Performance / latency / throughput
        - Embedded / no_std compatibility
        - Testing / benchmarking
        - Documentation
        - Refactor / technical debt
        - Other

  - type: textarea
    id: what
    attributes:
      label: What does the enhancement do?
      description: |
        Give a high-level overview of how you suggest improving an existing GLRX feature or subsystem.
      placeholder: |
        Example: Improve the DSP layer by adding a streaming FIR filter and FFT wrapper for acquisition/tracking.

  - type: textarea
    id: implementation
    attributes:
      label: Implementation ideas or challenges
      description: |
        Describe how this could be implemented, and mention any trade-offs, risks, or difficulties.
      placeholder: |
        Example: Reuse rustfft for FFT, keep allocation-free hot paths, and preserve compatibility with embedded targets.
