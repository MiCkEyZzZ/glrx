name: Docs

on:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: |
          RUSTDOCFLAGS="-D warnings" \
          cargo doc \
            --workspace \
            --all-features \
            --no-deps
