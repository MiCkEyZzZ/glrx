[profile.default]

# Timeout configuration for "slow" tests:
# - If a test runs longer than `period`, a termination attempt is triggered.
# - If the test does not finish within `grace-period`, it is forcefully terminated.
# - If this happens `terminate-after` times, the test is marked as failed.
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "30s" }

# Retry configuration for failed tests:
# - count: maximum number of retries (3 attempts)
# - delay: initial delay between retries (10 seconds)
# - backoff: type of delay growth (exponential backoff)
# - jitter: adds random variation to delay (to avoid retry "thundering herd")
retries = { backoff = "exponential", count = 3, delay = "10s", jitter = true }
