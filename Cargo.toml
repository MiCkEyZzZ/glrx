[package]
name = "glrx"
version = "0.1.0"
edition = "2021"
description = "GNSS software-defined receiver"
license = "MIT"

[[bin]]
name = "glrx"
path = "src/main.rs"

[features]
default = []
sdr = []

[dependencies]
byteorder = "1.5.0"
log = "0.4.29"
num-complex = "0.4.6"
parking_lot = "0.12.5"
rustfft = "6.4.1"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"
criterion = "0.8.2"
flamegraph = "0.6.11"
tokio-console = "0.1.14"
