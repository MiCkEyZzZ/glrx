[workspace]
resolver = "2"
members = [
    "benches",
    "examples",
]

[package]
name = "glrx"
version = "0.3.0"
description = "GNSS software-defined receiver"
documentation = "https://docs.rs/glrx"
homepage = "https://github.com/MiCkEyZzZ/glrx"
repository = "https://github.com/MiCkEyZzZ/glrx"
readme = "README.md"
license = "MIT OR Apache-2.0"
edition = "2024"
keywords = ["gnss", "gps", "sdr", "dsp", "receiver"]
categories = [
    "aerospace",
    "embedded",
    "science",
    "algorithms",
]
rust-version = "1.96"

[[bin]]
name = "glrx"
path = "src/main.rs"

[features]
# Default feature set is empty.
# The crate compiles in no_std environments with no flags enabled.
default = []
sdr = []
rayon = []

[dependencies]
byteorder = "1.5.0"
gnss-time = "0.5.3"
log = "0.4.29"
num-complex = "0.4.6"
parking_lot = "0.12.5"
rayon = "1.12.0"
rustfft = "6.4.1"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "fat"

[profile.bench]
codegen-units = 1
lto = "fat"
